name: Enable GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Enable Pages from branch main, folder root
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          body='{"source":{"branch":"main","path":"/"}}'
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' \
            -X POST "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -d "$body")
          echo "POST /pages -> $code"; cat /tmp/out.json
          if [ "$code" = "409" ]; then
            echo "Pages deja activat; actualizez sursa."
            code=$(curl -sS -o /tmp/out.json -w '%{http_code}' \
              -X PUT "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -d "$body")
            echo "PUT /pages -> $code"; cat /tmp/out.json
          fi
          case "$code" in 200|201|204) ;; *) echo "Nu am putut activa Pages."; exit 1 ;; esac

      - name: Show Pages status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}"
